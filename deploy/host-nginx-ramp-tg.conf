# Host-level nginx site for ramp-tg.metaversedu.in on 51.222.221.25.
# Install:  sudo cp host-nginx-ramp-tg.conf /etc/nginx/sites-available/ramp-tg.metaversedu.in
#           sudo ln -s /etc/nginx/sites-available/ramp-tg.metaversedu.in /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d ramp-tg.metaversedu.in     # issues the TLS cert and adds the 443 block

server {
    listen 80;
    server_name ramp-tg.metaversedu.in;

    client_max_body_size 50M;

    # Backend API (environment.prod.ts -> https://ramp-tg.metaversedu.in/workflow1).
    # Point this at wherever the Spring backend listens on the server.
    # location /workflow1/ {
    #     proxy_pass         http://127.0.0.1:8080/workflow1/;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # Angular frontend container (published on 127.0.0.1:8090 by the Jenkins deploy)
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
