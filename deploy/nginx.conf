# nginx config inside the frontend container: serves the Angular SPA.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets can be cached aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so new deployments are picked up
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Angular client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
